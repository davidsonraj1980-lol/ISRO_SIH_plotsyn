<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ISRO Netra-Vision Agent</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="agent-shell">
    <!-- Top Identity Bar -->
    <header class="agent-header">
      <div class="agent-brand">
        <img src="isro-logo.svg" alt="ISRO Official Logo" class="brand-isro-logo">
        <div class="brand-text">
          <div class="brand-name">
            <span>NETRA</span>
            <span class="brand-tag">ISRO PS-26171</span>
          </div>
          <div class="brand-desc">On-Device Visual Privacy Agent</div>
        </div>
      </div>
      <div class="agent-status-badge">
        <span class="status-pulse"></span>
        <span id="agent-state-label">ARMED</span>
      </div>
    </header>

    <!-- Telemetry Hardware Specs -->
    <div class="hardware-strip">
      <div class="hw-item">
        <span class="hw-label">Vision Backbone</span>
        <span class="hw-val">WebGPU • YOLOS</span>
      </div>
      <div class="hw-divider"></div>
      <div class="hw-item">
        <span class="hw-label">Zero-Leak Guard</span>
        <span class="hw-val text-emerald">0.00% Exfiltration</span>
      </div>
    </div>

    <!-- Main Content Form -->
    <div class="agent-content">
      <!-- Mode Selection -->
      <div class="control-group">
        <div class="control-header">
          <label for="redaction-mode" class="control-label">Canvas Privacy Filter</label>
          <span class="control-meta">Hardware Shader</span>
        </div>
        <div class="select-wrapper">
          <select id="redaction-mode" class="agent-select">
            <option value="gaussian_blur" selected>Gaussian Blur (Local Shader Filter)</option>
            <option value="blackout">Solid Blackout (Zero-Leak Default)</option>
            <option value="pixelate">20px Mosaic Pixelation</option>
            <option value="synthetic_token">Synthetic Token Replacement</option>
          </select>
        </div>
      </div>

      <!-- Agent Mission Directive -->
      <div class="control-group">
        <div class="control-header">
          <label for="agent-goal" class="control-label">Agent Mission Directive</label>
        </div>
        <textarea 
          id="agent-goal" 
          class="agent-textarea" 
          rows="2"
          placeholder="Enter natural language instruction..."
        >Verify credentials, acknowledge protocol, and authorize clearance decree</textarea>
      </div>

      <!-- Primary Action Buttons -->
      <div class="action-grid">
        <button type="button" id="btn-scan-pii" class="btn btn-glass">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
          <span>Mask PII</span>
        </button>
        <button type="button" id="btn-run-agent" class="btn btn-glow">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="5 3 19 12 5 21 5 3"/>
          </svg>
          <span>Run Agent</span>
        </button>
      </div>

      <!-- Live Execution Telemetry -->
      <div class="terminal-shell">
        <div class="terminal-header">
          <div class="terminal-dots">
            <span class="dot dot-r"></span>
            <span class="dot dot-y"></span>
            <span class="dot dot-g"></span>
          </div>
          <span class="terminal-title">LIVE TELEMETRY STREAM</span>
          <span id="masked-counter" class="terminal-badge">READY</span>
        </div>
        <div id="telemetry-log" class="terminal-body">
          <div class="log-row">
            <span class="log-prefix">&gt;</span>
            <span class="log-text">Netra agent standing by on active browser window.</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer Security Notice -->
    <footer class="agent-footer">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      <span>Client-Side Local Vision • Zero Raw Pixels Exported</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
